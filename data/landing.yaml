# Hero
hero:
  enable: true
  weight: 10
  template: hero

  backgroundImage:
    path: "images/"
    filename:
      desktop: "gradient-desktop-2.webp" #"gimp-3.2rc2-edit.jpg" 
      mobile:  "gradient-desktop-2.webp"  #"gimp-3.2rc2-edit.jpg"

  badge:
    text: v1.0.1
    color: primary # primary, secondary, success, danger, warning, info, light, dark
    pill: false # boolean
    soft: false # boolean

  titleLogo:
    path: "images/logos"
    filename: "logo.png"
    alt: "Lotus Docs Logo"
    height: 70px

  title: "Jin Y.C"
  subtitle: "Technical Writer"

  ctaButton:
    icon: auto_awesome
    btnText: "About me"
    btnColor: danger
    url: "/docs/about"
  cta2Button:
    icon: person
    btnText: "LinkedIn"
    url: "https://linkedin.com/in/redzhift"

  info: ""

